<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Джалка — Каталог</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#193c30;font:16px system-ui,sans-serif}header{background:#164c39;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}main{max-width:1000px;margin:auto;padding:14px}button,input,textarea,select{font:inherit;border:1px solid #ccd5cb;border-radius:12px;padding:12px;background:white;color:#193c30}button{cursor:pointer;font-weight:650}button.primary{background:#164c39;color:white}input,textarea,select{width:100%;margin:5px 0}label{display:block;margin-top:8px}.card{background:white;border:1px solid #dce1d8;border-radius:18px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.grid .card{margin:0}.pic{width:100%;aspect-ratio:1;object-fit:contain;background:#f0f2ec;border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.banner{background:#164c39;color:white;border-radius:18px;padding:20px;display:flex;justify-content:space-between;gap:12px}.banner img{width:110px;object-fit:contain}.muted{color:#68776e}h1,h2,h3{margin:8px 0}dialog{border:0;border-radius:18px;max-width:95vw;width:550px;max-height:90vh;overflow:auto;color:#193c30}dialog::backdrop{background:#0008}img{max-width:100%}footer{padding:20px;text-align:center}.err{color:#a22}a{color:#164c39}#notice{white-space:pre-wrap} </style><header><div><b>Джалка · Магазин</b><br><small>Всё рядом</small></div><button id="account">Кабинет</button></header><main><div id="notice"></div><section id="view">Загрузка…</section></main><dialog id="modal"></dialog><footer>Джалка · Интернет-магазины</footer><script>
const db=supabase.createClient('https://oyrbnkdohzeibprvtnnx.supabase.co','sb_publishable_5KY7WZw98LQtSqhwDL333w__2vkNddh');
const view=document.querySelector('#view'),modal=document.querySelector('#modal'),notice=document.querySelector('#notice');let shop=null,items=[],offset=0,cart={},session=null,admin=false,visitor=localStorage.shopVisitor||crypto.randomUUID();localStorage.shopVisitor=visitor;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>Number(x).toLocaleString('ru-RU')+' ₽';const img=(url,cls='pic')=>/^https:\/\//i.test(url||'')?`<img class="${cls}" src="${esc(url)}" loading="lazy" alt="">`:'<div class="pic" style="display:grid;place-items:center;font-size:40px">📦</div>';const link=s=>location.origin+location.pathname+'?shop='+encodeURIComponent(s.slug);function fail(e){notice.className='err';notice.textContent=e.message||String(e);if(modal.open)alert(notice.textContent)}async function run(f){notice.textContent='';try{await f()}catch(e){fail(e)}}function check(r){if(r.error)throw r.error;return r.data}function open(html){modal.innerHTML=html; if(!modal.open)modal.showModal()}const closeButton='<button onclick="modal.close()">Закрыть</button>';function track(event,item=''){if(shop)db.rpc('track_shop',{p_shop:shop.id,p_item:item,p_event:event,p_visitor:visitor}).then(()=>{},()=>{})}const btn=(label,action)=>`<button class="primary" onclick="${action}">${label}</button>`;
async function start(){const slug=new URLSearchParams(location.search).get('shop');if(slug){shop=check(await db.from('shops').select('id,name,slug,description,address,phone,whatsapp,logo,ad_text,ad_photo').eq('slug',slug).eq('active',true).single());track('shop');catalog()}else{let shops=check(await db.from('shops').select('name,slug,description,logo').eq('active',true).order('name').limit(100));view.innerHTML='<h2>Магазины</h2>'+ (shops.length?shops.map(s=>`<div class="card">${esc(s.name)}<br>${esc(s.description)}<br><a href="${esc(link(s))}">Открыть каталог</a></div>`).join(''):'<p>Магазинов пока нет. Создайте первый в кабинете.</p>')}}
function catalog(){view.innerHTML=`<div class="banner"><div><small>Интернет-магазин</small><h1>${esc(shop.name)}</h1>${esc(shop.address)}<p>${esc(shop.description)}</p></div><div>${shop.ad_photo?img(shop.ad_photo):''}<b>${esc(shop.ad_text)}</b></div></div><div class="row">${shop.phone?`<a onclick="track('call')" href="tel:${esc(shop.phone.replace(/[^+\d]/g,''))}">Позвонить</a>`:''}${btn('Корзина','showCart()')}</div><input id="search" placeholder="Название или артикул"><div id="goods" class="grid"></div><button id="more" onclick="run(()=>load(false))">Ещё товары</button>`;let timer;document.querySelector('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>run(()=>load(true)),350)};run(()=>load(true))}
let generation=0;async function load(reset){if(reset){offset=0;items=[];generation++}const g=generation;let q=document.querySelector('#search').value.trim(),req=db.from('products').select('id,article,name,category,price,unit,thumbnail,available').eq('shop_id',shop.id).eq('published',true).order('article').range(offset,offset+29);if(q)req=/^\d+$/.test(q)?req.eq('article',Number(q)):req.ilike('name','%'+q+'%');let rows=check(await req);if(g!==generation)return;items.push(...rows);offset+=rows.length;document.querySelector('#goods').innerHTML=items.map((p,i)=>`<div class="card"><div onclick="run(()=>detail(${i}))" style="cursor:pointer">${img(p.thumbnail)}<h3>${esc(p.name)}</h3><small>№ ${String(p.article).padStart(4,'0')}</small><p>${money(p.price)} / ${esc(p.unit)}</p></div><button class="primary" ${p.available?'':'disabled'} onclick="add(${i})">${p.available?'В корзину':'Нет в наличии'}</button></div>`).join('');document.querySelector('#more').hidden=rows.length<30}
async function detail(i){let p=check(await db.from('products').select('*').eq('id',items[i].id).single());track('product',p.id);open(`${closeButton}<h2>${esc(p.name)}</h2><p>№ ${String(p.article).padStart(4,'0')}</p>${(p.gallery.length?p.gallery:[p.thumbnail]).filter(Boolean).map(u=>`<div onclick="this.querySelector('img').requestFullscreen?.()">${img(u)}</div>`).join('')}<h2>${money(p.price)}</h2><p>${esc(p.description)}</p><p style="white-space:pre-wrap">${esc(p.specifications)}</p><button class="primary" ${p.available?'':'disabled'} onclick="add(${i});modal.close()">В корзину</button>`)}function add(i){let p=items[i];cart[p.id]=cart[p.id]||{p,n:0};cart[p.id].n++;track('cart',p.id);notice.textContent='Товар добавлен в корзину'}function showCart(){let rows=Object.values(cart);open(closeButton+'<h2>Корзина</h2>'+rows.map(({p,n})=>`<div class="card">№ ${p.article} · ${esc(p.name)} · ${n} × ${money(p.price)} <button onclick="delete cart['${p.id}'];showCart()">Удалить</button></div>`).join('')+'<h3>Итого: '+money(rows.reduce((v,r)=>v+r.n*r.p.price,0))+'</h3>'+btn('Скопировать список','copyOrder()')+' '+btn('WhatsApp','sendOrder()'))}function order(){return shop.name+'\n'+Object.values(cart).map(({p,n})=>`№ ${p.article} ${p.name} — ${n} × ${money(p.price)}`).join('\n')}async function copyOrder(){await navigator.clipboard.writeText(order());notice.textContent='Список скопирован'}function sendOrder(){let n=(shop.whatsapp||shop.phone||'').replace(/\D/g,'');if(n.length===11&&n[0]==='8')n='7'+n.slice(1);if(!n){alert('Номер WhatsApp не указан');return}track('whatsapp');location.href='https://wa.me/'+n+'?text='+encodeURIComponent(order())}
document.querySelector('#account').onclick=()=>run(account);async function account(){session=check(await db.auth.getSession()).session;if(!session){open(`<h2>Вход в кабинет</h2><input id="email" type="email" placeholder="Электронная почта"><input id="pass" type="password" placeholder="Пароль">${btn('Войти','run(login)')} ${closeButton}`);return}admin=check(await db.rpc('shop_is_admin'));manage()}
async function login(){check(await db.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#pass').value}));modal.close();await account()}
let managed=[],current=null,products=[];async function manage(){let q=db.from('shops').select('*').order('name');if(!admin)q=q.eq('owner_id',session.user.id);managed=check(await q);view.innerHTML=`<h2>${admin?'Администратор':'Мой бизнес'}</h2><button onclick="run(logout)">Выйти</button> ${admin?btn('Создать магазин','editShop(-1)'):''}`+managed.map((s,i)=>`<div class="card"><h3>${esc(s.name)}</h3><a href="${esc(link(s))}">Ссылка покупателя</a><div class="row">${btn('Настройки',`editShop(${i})`)} ${btn('Товары',`run(()=>manageProducts(${i}))`)} ${btn('Статистика',`run(()=>stats(${i}))`)}</div></div>`).join('')}
async function logout(){check(await db.auth.signOut());location.reload()}
function field(id,title,value='',type='text'){return `<label>${title}<input id="${id}" type="${type}" value="${esc(value)}"></label>`}const val=id=>document.getElementById(id).value.trim();function editShop(i){let s=managed[i]||{};open('<h2>Настройки магазина</h2>'+field('sn','Название',s.name)+ (i<0?field('slug','Короткое имя латиницей')+field('owner','UID продавца (из Supabase Users)'):'')+field('sd','Описание',s.description)+field('sa','Адрес',s.address)+field('sp','Телефон',s.phone)+field('sw','WhatsApp',s.whatsapp)+field('ad','Рекламный текст',s.ad_text)+'<label>Фото рекламы<input id="adfile" type="file" accept="image/*"></label>'+btn('Сохранить',`run(()=>saveShop(${i}))`)+' '+closeButton)}
async function upload(file,shopid,max){let bitmap=await createImageBitmap(file),scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();let b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));if(!b||b.size>2097152)throw Error('Фото слишком большое');let path=shopid+'/'+crypto.randomUUID()+'.jpg';check(await db.storage.from('shop-images').upload(path,b,{contentType:'image/jpeg'}));return db.storage.from('shop-images').getPublicUrl(path).data.publicUrl}
async function saveShop(i){let data={name:val('sn'),description:val('sd'),address:val('sa'),phone:val('sp'),whatsapp:val('sw'),ad_text:val('ad')};if(!data.name)throw Error('Введите название');let id;if(i<0){data.slug=val('slug');if(!/^[a-z0-9-]+$/.test(data.slug))throw Error('Короткое имя: латиница, цифры, дефис');data.owner_id=val('owner')||null;id=check(await db.from('shops').insert(data).select('id').single()).id}else{id=managed[i].id;check(await db.from('shops').update(data).eq('id',id))}let f=document.querySelector('#adfile').files[0];if(f)check(await db.from('shops').update({ad_photo:await upload(f,id,800)}).eq('id',id));modal.close();manage()}
let mo=0;async function manageProducts(i){current=managed[i];mo=0;view.innerHTML=`<button onclick="run(manage)">Назад</button><h2>${esc(current.name)}</h2>${btn('Добавить товар','run(()=>editProduct(-1))')}<input id="ms" placeholder="Поиск по названию или номеру"><div id="ml"></div><button id="mm" onclick="run(()=>mp(false))">Ещё</button>`;let t;document.querySelector('#ms').oninput=()=>{clearTimeout(t);t=setTimeout(()=>run(()=>mp(true)),300)};await mp(true)}
async function mp(reset){if(reset){mo=0;products=[]}let q=val('ms'),r=db.from('products').select('id,article,name,price,available').eq('shop_id',current.id).order('article').range(mo,mo+29);if(q)r=/^\d+$/.test(q)?r.eq('article',Number(q)):r.ilike('name','%'+q+'%');let rows=check(await r);products.push(...rows);mo+=rows.length;document.querySelector('#ml').innerHTML=products.map((p,i)=>`<div class="card">№ ${p.article} · ${esc(p.name)} · ${money(p.price)}<br>${btn('Изменить',`run(()=>editProduct(${i}))`)} <button onclick="run(()=>removeProduct(${i}))">Удалить</button></div>`).join('');document.querySelector('#mm').hidden=rows.length<30}
let editing=null;async function editProduct(i){editing=i<0?null:check(await db.from('products').select('*').eq('id',products[i].id).single());let p=editing||{};open('<h2>Товар</h2>'+field('pn','Название',p.name)+field('pc','Категория',p.category)+field('pp','Цена',p.price??0,'number')+field('pu','Единица',p.unit||'шт.')+`<label>Описание<textarea id="pd">${esc(p.description)}</textarea></label><label>Характеристики<textarea id="ps">${esc(p.specifications)}</textarea></label><label>До 5 фото (заменят старую галерею)<input id="pf" type="file" multiple accept="image/*"></label><label><input style="width:auto" id="pa" type="checkbox" ${p.available!==false?'checked':''}> В наличии</label><label><input style="width:auto" id="pub" type="checkbox" ${p.published!==false?'checked':''}> Показывать покупателям</label>`+btn('Сохранить','run(saveProduct)')+' '+closeButton)}
async function saveProduct(){let p={name:val('pn'),category:val('pc'),price:Number(val('pp')),unit:val('pu'),description:val('pd'),specifications:val('ps'),available:document.querySelector('#pa').checked,published:document.querySelector('#pub').checked};if(!p.name||!Number.isFinite(p.price)||p.price<0)throw Error('Проверьте название и цену');let fs=[...document.querySelector('#pf').files];if(fs.length>5)throw Error('Не более 5 фото');if(fs.length){p.gallery=[];for(let f of fs)p.gallery.push(await upload(f,current.id,1600));p.thumbnail=await upload(fs[0],current.id,360)}if(editing)check(await db.from('products').update(p).eq('id',editing.id));else check(await db.from('products').insert({...p,shop_id:current.id}));modal.close();await mp(true)}async function removeProduct(i){if(confirm('Удалить товар?')){check(await db.from('products').delete().eq('id',products[i].id));await mp(true)}}
async function stats(i){let s=managed[i],rows=check(await db.rpc('get_shop_stats',{p_shop:s.id}));let labels={};let ids=[...new Set(rows.filter(r=>r.event==='product').map(r=>r.item))];for(let j=0;j<ids.length;j+=50){let ps=check(await db.from('products').select('id,name,article').in('id',ids.slice(j,j+50)));for(let p of ps)labels[p.id]='№ '+p.article+' '+p.name}let today=new Date().toISOString().slice(0,10);let names={shop:'Просмотры магазина',product:'Просмотры товаров',cart:'Добавления в корзину',whatsapp:'Переходы WhatsApp',call:'Звонки'};open('<h2>Статистика · '+esc(s.name)+'</h2>'+Object.entries(names).map(([k,n])=>`<div class="card">${n}<h3>Сегодня: ${rows.filter(r=>r.event===k&&r.day===today).reduce((a,r)=>a+Number(r.total),0)}</h3>Всего: ${rows.filter(r=>r.event===k).reduce((a,r)=>a+Number(r.total),0)}</div>`).join('')+'<h3>Просмотры по товарам</h3>'+Object.entries(rows.filter(r=>r.event==='product').reduce((a,r)=>(a[r.item]=(a[r.item]||0)+Number(r.total),a),{})).map(([id,n])=>`<p>${esc(labels[id]||"Удалённый товар")}: ${n}</p>`).join('')+closeButton)}run(start);
</script></html>
